name: Daily Quant Exposure Update

on:
  schedule:
    # 周二至周六 UTC 00:15（对应美东周一至周五盘后：冬令时 19:15 / 夏令时 20:15；北京时间早 08:15）
    # 确保美股正式收盘价与 VWEHX/VFITX 债基当日净值全部入库
    - cron: '15 0 * * 2-6'
  workflow_dispatch: # 允许在 GitHub 页面手动一键触发

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quant exposure script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python update_data.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "Quant Bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add data/latest_data.json
          git diff --staged --quiet || git commit -m "chore: update quant exposure data"
          git push
